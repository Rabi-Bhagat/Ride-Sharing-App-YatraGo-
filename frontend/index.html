<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/yatrago-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="YatraGo — smart ride-sharing, carpool pooling, 3D route previews, verified local guiders, group fare splitting and 24/7 SOS safety." />
    <meta property="og:title" content="YatraGo - Smart Ride Sharing & 3D Mobility Platform" />
    <meta property="og:description" content="Share rides, split fares with friends, explore 3D destinations and travel safely with verified drivers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/yatrago-logo.webp" />
    <title>YatraGo - Smart Ride Sharing & 3D Mobility Platform</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Apply the saved theme before first paint to avoid a dark/light flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('yatrago_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
        window.__YATRAGO_GMAPS_FAILED__ = false;
        // Google Maps calls this globally when the API key is invalid, restricted,
        // or billing is disabled. Treat that as "unavailable" so we can fall back.
        window.gm_authFailure = function () {
          window.__YATRAGO_GMAPS_FAILED__ = true;
          try { window.dispatchEvent(new Event('yatrago:gmaps-auth-failure')); } catch (e) {}
        };
      })();
    </script>
    <!-- Google Maps JavaScript API (key via VITE_GOOGLE_MAPS_API_KEY at build time) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=places,geometry"></script>
    <!-- Razorpay Standard Web Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
